# XcodeGen spec — generates ItalianBibbiaStudy.xcodeproj so the .xcodeproj
# never needs to be committed or hand-maintained.
#
#   brew install xcodegen
#   cd ios-native && xcodegen generate
#   open ItalianBibbiaStudy.xcodeproj
#
# Before shipping, change PRODUCT_BUNDLE_IDENTIFIER to your own reverse-DNS
# id (see DEPLOYMENT.md step 2) — App Store bundle ids must be unique.

name: ItalianBibbiaStudy

options:
  deploymentTarget:
    # Minimum OS the app will install on (NOT the SDK it builds against).
    iOS: "26.6"
  createIntermediateGroups: true
  groupSortPosition: top

schemes:
  # Declared explicitly for one reason: OS_ACTIVITY_MODE below. Without a
  # schemes: block XcodeGen leaves Xcode to autocreate an implicit scheme, so
  # this also makes the scheme reproducible across clones instead of being
  # whatever each machine happens to generate.
  ItalianBibbiaStudy:
    build:
      targets:
        ItalianBibbiaStudy: all
    run:
      config: Debug
      environmentVariables:
        # iOS 26 logs a torrent of system chatter — Liquid Glass tab-bar
        # layout invalidations (_UILiquidLensView, _UITabSelectionView),
        # "cannot add handler to 0 from 0", accessibility and PointerUI
        # messages — none of it from this app, all of it burying the app's
        # own output. This silences it for Run only.
        #
        # Trade-off: it suppresses os_log/NSLog generally, `print` still
        # shows. If this app ever adopts Logger, remove this line or the
        # logging will vanish with the noise.
        OS_ACTIVITY_MODE: disable
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

packages:
  BibbiaCore:
    path: BibbiaCore

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  ItalianBibbiaStudy:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: BibbiaCore
    settings:
      base:
        # Must be globally unique — com.example.* is rejected at registration.
        # Set here, not in Xcode's Signing & Capabilities pane: `xcodegen
        # generate` rewrites the project and would discard a UI-only change.
        PRODUCT_BUNDLE_IDENTIFIER: com.lousimonetti.italianbibbiastudy
        # Your Personal Team id (free Apple ID). Fill this in once and
        # regenerating the project keeps working without re-picking the team:
        #   DEVELOPMENT_TEAM: XXXXXXXXXX
        TARGETED_DEVICE_FAMILY: "1,2"        # iPhone + iPad
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Italian Bible Study
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: >-
          The microphone lets you practice pronouncing Italian words and
          sentences; audio is processed on-device and never uploaded.
        NSSpeechRecognitionUsageDescription: >-
          Speech recognition scores your Italian pronunciation. Recognition
          runs through Apple's speech service; no recordings are stored.
        ITSAppUsesNonExemptEncryption: false
